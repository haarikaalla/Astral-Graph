name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Fast tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install             pytest pytest-asyncio             pydantic pydantic-settings python-dotenv             httpx networkx mcp langgraph langchain-core             structlog rich

      - name: Compile importable modules
        run: python -m compileall agents api core eval graph guardrails mcp_servers rag scripts ui

      - name: Run fast tests
        run: pytest -m "not integration" --maxfail=1 --disable-warnings

  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js for official MCP servers
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run live integration tests
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY || 'DEMO_KEY' }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -m integration --maxfail=1 --disable-warnings
