<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AstralGraph architecture map</title>
  <desc id="desc">A compact architecture diagram showing a user question entering FastAPI, moving through agents, crossing the MCP boundary into data servers, and returning a cited answer from a provenance graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FBFF"/>
      <stop offset="0.55" stop-color="#F7FFF9"/>
      <stop offset="1" stop-color="#FFF9F1"/>
    </linearGradient>
    <linearGradient id="api" x1="80" y1="126" x2="257" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="agent" x1="310" y1="82" x2="545" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="mcp" x1="600" y1="78" x2="835" y2="314" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .label{font:700 21px Inter,Arial,sans-serif;fill:#0F172A}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#475569}
      .tiny{font:600 12px Inter,Arial,sans-serif;fill:#64748B}
      .white{fill:#FFFFFF}
      .pill{fill:#FFFFFF;stroke:#D8E3F0;stroke-width:1.3}
      .line{stroke:#334155;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}
      .softline{stroke:#94A3B8;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 7}
    </style>
  </defs>

  <rect width="960" height="540" rx="30" fill="url(#bg)"/>
  <rect x="28" y="26" width="904" height="488" rx="28" fill="#FFFFFF" fill-opacity="0.58" stroke="#D8E3F0"/>

  <text x="72" y="70" class="label">AstralGraph Architecture</text>
  <text x="72" y="96" class="small">Question -> agents -> MCP tools -> provenance graph -> cited answer</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="190" height="112" rx="22" fill="url(#api)"/>
    <text x="100" y="193" class="white label">FastAPI</text>
    <text x="100" y="220" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#DBEAFE">/ask + /ask/stream</text>
    <text x="100" y="242" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="500" fill="#ECFEFF">receives the question</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="126" width="220" height="212" rx="24" fill="url(#agent)"/>
    <text x="365" y="169" class="white label">Agent Workflow</text>
    <rect x="362" y="192" width="156" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="385" y="212" class="tiny">Intent parser</text>
    <rect x="362" y="235" width="156" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="385" y="255" class="tiny">Domain agents</text>
    <rect x="362" y="278" width="156" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="385" y="298" class="tiny">Critic checks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="126" width="240" height="212" rx="24" fill="url(#mcp)"/>
    <text x="650" y="169" class="white label">MCP Boundary</text>
    <rect x="642" y="192" width="176" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="665" y="212" class="tiny">Registry + permissions</text>
    <rect x="642" y="235" width="176" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="665" y="255" class="tiny">NASA / JPL / ISS / RAG</text>
    <rect x="642" y="278" width="176" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.94"/>
    <text x="665" y="298" class="tiny">Filesystem / memory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="236" y="386" width="218" height="74" rx="20" fill="#FFFFFF" stroke="#D8E3F0"/>
    <text x="268" y="418" class="label" font-size="19">Evidence Graph</text>
    <text x="268" y="442" class="small">facts, sources, citations</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="512" y="386" width="218" height="74" rx="20" fill="#FFFFFF" stroke="#D8E3F0"/>
    <text x="547" y="418" class="label" font-size="19">Final Answer</text>
    <text x="547" y="442" class="small">verified + traceable</text>
  </g>

  <path class="line" d="M260 206H320"/>
  <path class="line" d="M550 232H600"/>
  <path class="line" d="M730 338V374C730 390 720 423 688 423"/>
  <path class="line" d="M454 423H502"/>
  <path class="line" d="M512 386C474 357 454 347 440 338"/>
  <path class="softline" d="M345 386C326 341 324 300 341 264"/>

  <g>
    <rect x="70" y="386" width="118" height="42" rx="21" class="pill"/>
    <text x="96" y="412" class="tiny">User question</text>
    <path class="line" d="M188 407H226"/>
  </g>

  <text x="314" y="204" class="tiny">route</text>
  <text x="556" y="218" class="tiny">tool calls</text>
  <text x="702" y="368" class="tiny">results</text>
  <text x="461" y="408" class="tiny">check</text>
</svg>
