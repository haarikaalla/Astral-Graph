[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astralgraph"
version = "0.1.0"
description = "Verifiable agentic RAG for astronomy and space research using MCP, provenance graphs, and critic-based grounding."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Haarika Alla" }]
keywords = [
  "agentic-rag",
  "mcp",
  "model-context-protocol",
  "astronomy",
  "knowledge-graph",
  "langgraph",
  "fastapi",
  "ai-agents"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "mcp>=1.9.0,<3.0.0",
  "langgraph>=0.2.60,<1.0.0",
  "langchain-core>=0.3.29,<1.0.0",
  "anthropic>=0.42.0,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "sse-starlette>=2.1.3,<3.0.0",
  "python-multipart>=0.0.12,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "networkx>=3.3,<4.0",
  "neo4j>=5.25.0,<6.0.0",
  "chromadb>=0.5.20,<1.0.0",
  "sentence-transformers>=3.3.0,<6.0.0",
  "feedparser>=6.0.11,<7.0.0",
  "datasets>=3.1.0,<5.0.0",
  "langfuse>=2.53.0,<4.0.0",
  "structlog>=24.4.0,<26.0.0",
  "rich>=13.9.0,<15.0.0",
  "streamlit>=1.40.0,<2.0.0",
  "plotly>=5.24.0,<7.0.0",
  "pandas>=2.2.0,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0"
]

[project.urls]
Homepage = "https://github.com/haarikaalla/Astral-Graph"
Repository = "https://github.com/haarikaalla/Astral-Graph"
Issues = "https://github.com/haarikaalla/Astral-Graph/issues"

[tool.setuptools.packages.find]
include = [
  "agents*",
  "api*",
  "core*",
  "eval*",
  "graph*",
  "guardrails*",
  "mcp_servers*",
  "rag*",
  "scripts*",
  "ui*"
]
